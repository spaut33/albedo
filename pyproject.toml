[project]
name = 'albedo'
version = '0.1.0'
description = 'Autonomous engineering on top of Claude Code, driving Linear-tracked tasks from decomposition to merge-ready PR.'
readme = 'README.md'
requires-python = '>=3.12'
license = { text = 'MIT' }
authors = [{ name = 'Roman Petrakov', email = 'roman.petrakov@gmail.com' }]
dependencies = [
    'httpx>=0.27',
    'pydantic>=2.7',
    'pydantic-settings>=2.3',
    'pyyaml>=6.0',
    'jinja2>=3.1',
    'structlog>=24.1',
    "rich>=13.7",
]

[project.scripts]
albedo = 'albedo.__main__:main'
albedo-mcp-github-proxy = 'albedo.mcp_github_proxy:main'
albedo-mcp-linear-proxy = 'albedo.mcp_linear_proxy:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/albedo']

[dependency-groups]
dev = [
    'pytest>=8.2',
    'pytest-cov>=5.0',
    'ruff>=0.6',
    'pyright>=1.1.380',
]

[tool.ruff]
line-length = 88
target-version = 'py312'
src = ['src', 'tests']

[tool.ruff.lint]
select = [
    'E',   # pycodestyle errors
    'F',   # pyflakes
    'W',   # pycodestyle warnings
    'I',   # isort
    'N',   # pep8-naming
    'UP',  # pyupgrade
    'B',   # flake8-bugbear
    'A',   # flake8-builtins
    'C4',  # flake8-comprehensions
    'SIM', # flake8-simplify
    'RUF', # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = ['S101']

[tool.ruff.format]
quote-style = 'single'
indent-style = 'space'
docstring-code-format = true

[tool.pytest.ini_options]
minversion = '8.0'
testpaths = ['tests']
addopts = [
    '-ra',
    '--strict-markers',
    '--strict-config',
    '--cov=albedo',
    '--cov-report=term-missing',
    '--cov-fail-under=80',
]

[tool.coverage.run]
branch = true
source = ['albedo']

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'if __name__ == .__main__.:',
    'raise NotImplementedError',
]

[tool.pyright]
include = ['src/albedo', 'tests']
pythonVersion = '3.12'
typeCheckingMode = 'strict'
reportMissingTypeStubs = false
